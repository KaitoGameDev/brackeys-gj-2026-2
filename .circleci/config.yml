# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1
  
  # Define a job to be invoked later in a workflow.
  # See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs

filter-master: &filter-main
  branches:
    only:
      - /main/
    ignore:
      - /.*/

jobs:
  build-and-publish:
    docker:
      - image: barichello/godot-ci:4.7.2

    steps:
      - checkout
      - run:
          name: "Build"
          command: |
            mkdir -v -p build/web
            EXPORT_DIR="$(readlink -f build)"
            godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - run:
          name: "Publish Itch.io"
          command: |
            butler login
            butler push ./build/web $ITCHIO_USERNAME/$ITCHIO_GAME:web

workflows:
  main-workflow:
    jobs:
      - authorize-workflow:
          type: approval
          filters:
            <<: *filter-main

      - build-and-publish:
          requires:
            - authorize-workflow
          filters:
            <<: *filter-main